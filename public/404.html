<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sadguru Estate</title>
  <script type="text/javascript">
    // GitHub Pages SPA routing redirect handler
    // This script is executed when a 404 error occurs on GitHub Pages
    // It redirects the user back to index.html with the original path preserved
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/sadguruEstate/?/' + l.pathname.slice(1).split('/').slice(1).join('/') +
      (l.search ? '&' + l.search.slice(1) : '') +
      window.location.hash
    );
  </script>
</head>
<body>
</body>
</html>
