    <meta name="description" content="Discover premium properties in Mumbai, Pune, Bangalore and more. Expert guidance, 24/7 support, and instant booking assistance." />
    
    <!-- Google Fonts - Source Serif 4 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // GitHub Pages SPA routing redirect handler
      // This script handles the redirect from 404.html back to the React app
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          window.history.replaceState(null, null, redirect);
        } else {
          // Check if we're coming from a 404 redirect with query params
          var l = window.location;
          if (l.search && l.search.startsWith('?/')) {
            // Extract the actual path from the query parameter
            var path = '/' + l.search.slice(2).replace('&', '?');
            window.history.replaceState(null, null, path + l.hash);
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
